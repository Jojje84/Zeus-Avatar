<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>Zeus Companion</title>
<style>
:root{--text:#f4f8ff;--muted:#9db2cb;--line:rgba(255,255,255,.11);--blue:#81d3ff;--ok:#67e7aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#020812}
body{background:radial-gradient(circle at 50% 38%,#173f6d 0,#071524 45%,#020812 82%)}
.app{position:relative;width:100%;height:100dvh;min-height:100vh;overflow:hidden}.viewer{position:absolute;inset:0;touch-action:none}.viewer canvas{display:block;width:100%;height:100%}
.top{position:absolute;z-index:5;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(15px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:11px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#a7e8ff,#609bff);color:#07111e;font-size:30px;font-weight:900;box-shadow:0 12px 32px #0007}.title{font-size:clamp(1.2rem,5vw,1.7rem);font-weight:850;text-shadow:0 2px 14px #000}.status{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#07111edb;font-size:.73rem;color:#a9bed4;backdrop-filter:blur(14px)}.status.ok{color:#9af0bf;border-color:#67e7aa55}
.loading{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#07111ee8;color:#d9ecff;font-size:.8rem}
.state-note{position:absolute;z-index:5;left:50%;bottom:102px;transform:translateX(-50%);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#07111ed7;color:#9db2cb;font-size:.71rem;white-space:nowrap;pointer-events:none}
.controls{position:absolute;z-index:5;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border:1px solid var(--line);border-radius:22px;background:#07111edc;backdrop-filter:blur(18px);box-shadow:0 18px 45px #0009}.controls button{border:1px solid var(--line);border-radius:15px;background:#ffffff08;color:var(--text);padding:10px 13px;font-size:.88rem;white-space:nowrap;cursor:pointer}.controls button.active{background:#61b5ff25;border-color:#81d3ffaa;box-shadow:inset 0 0 18px #5dafff15}
.credit{position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:.61rem;color:#6f8499;pointer-events:none}.credit a{color:#88bfe7}
@media(max-width:560px){.logo{width:48px;height:48px}.title{font-size:1.25rem}.status{font-size:.68rem}.controls{gap:4px;max-width:calc(100vw - 14px)}.controls button{font-size:.79rem;padding:9px 10px}.state-note{bottom:94px}.credit{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="viewer" id="viewer"><canvas id="canvas"></canvas></div>
  <div class="top"><div class="brand"><div class="logo">ϟ</div><div class="title">Zeus Companion</div></div><div class="status" id="status">Laddar 3D…</div></div>
  <div class="loading" id="loading">Laddar Zeus direkt…</div>
  <div class="state-note" id="stateNote">Idle · originalrörelse</div>
  <div class="controls">
    <button class="active" data-state="idle">😌 Idle</button>
    <button data-state="listening">👂 Lyssnar</button>
    <button data-state="thinking">🤔 Tänker</button>
    <button data-state="speaking">🗣️ Pratar</button>
  </div>
  <div class="credit">Zeus Idle · SomeDude / Patyot.Suttipreecha · CC Attribution</div>
</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import {GLTFLoader} from 'https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
import {gunzipSync} from 'https://esm.sh/fflate@0.8.2';

const canvas=document.getElementById('canvas'),viewer=document.getElementById('viewer'),loading=document.getElementById('loading'),status=document.getElementById('status'),stateNote=document.getElementById('stateNote'),buttons=[...document.querySelectorAll('.controls button')];
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.14;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,.01,100);
scene.add(new THREE.HemisphereLight(0xf1f9ff,0x13213a,2.6));
const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(4,7,7);scene.add(key);
const fill=new THREE.PointLight(0x67caff,11,20);fill.position.set(-4,3,5);scene.add(fill);
const rim=new THREE.PointLight(0xffd3b8,6,18);rim.position.set(4,2,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.5,72),new THREE.MeshBasicMaterial({color:0x57baff,transparent:true,opacity:.08,depthWrite:false}));floor.rotation.x=-Math.PI/2;scene.add(floor);

let model,mixer,action,state='idle',userYaw=0,drag=false,lastX=0;
const bones={},baseQ={};
const labels={idle:'Idle · originalrörelse',listening:'Lyssnar · lutar sig fram och lyssnar',thinking:'Tänker · hand mot ansiktet',speaking:'Pratar · tydliga armgester'};

function resize(){const r=viewer.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(()=>{resize();if(model)fitCamera();}).observe(viewer);

function fitCamera(){
 if(!model)return;
 model.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);model.updateMatrixWorld(true);
 const vf=THREE.MathUtils.degToRad(camera.fov),hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
 const dv=(size.y/2)/Math.tan(vf/2),dh=(size.x/2)/Math.tan(Math.max(.12,hf/2));
 const dist=Math.max(dv,dh)*1.04;
 camera.position.set(0,size.y*.015,dist);camera.lookAt(0,size.y*.015,0);camera.near=Math.max(.01,dist/100);camera.far=dist*20;camera.updateProjectionMatrix();
 floor.position.y=-size.y*.505;floor.scale.setScalar(Math.max(size.x,size.z)*.5);
}
function rememberBase(){Object.entries(bones).forEach(([n,b])=>baseQ[n]=b.quaternion.clone());}
function restoreBase(){Object.entries(bones).forEach(([n,b])=>{if(baseQ[n])b.quaternion.copy(baseQ[n]);});}
function rot(name,x=0,y=0,z=0){const b=bones[name],q=baseQ[name];if(!b||!q)return;b.quaternion.copy(q).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z,'XYZ')));}
function sampleNaturalPose(time=.22){if(!mixer||!action)return;action.stop();action.reset();action.play();mixer.setTime(time);action.paused=true;rememberBase();}
function startIdle(){if(!action)return;restoreBase();action.paused=false;action.enabled=true;action.reset();action.setLoop(THREE.LoopRepeat,Infinity);action.timeScale=.72;action.play();status.textContent='Idle-rörelse ✓';status.className='status ok';}
function setState(s){
 state=s;stateNote.textContent=labels[s];buttons.forEach(b=>b.classList.toggle('active',b.dataset.state===s));
 if(!action)return;
 if(s==='idle'){startIdle();return;}
 action.paused=true;action.stop();restoreBase();status.textContent=(s==='listening'?'Lyssnar':s==='thinking'?'Tänker':'Pratar')+' ✓';status.className='status ok';
}
buttons.forEach(b=>b.addEventListener('click',()=>setState(b.dataset.state)));

async function loadModel(){
 try{
  const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch(`assets/zeus-bin/part${String(i).padStart(2,'0')}.b64?v=20`).then(r=>{if(!r.ok)throw new Error('Kunde inte hämta modellbit '+i);return r.text();})));
  loading.textContent='Packar upp Zeus…';
  const raw=atob(parts.join('').replace(/\s+/g,'')),gz=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)gz[i]=raw.charCodeAt(i);
  const unpacked=gunzipSync(gz);const buf=unpacked.buffer.slice(unpacked.byteOffset,unpacked.byteOffset+unpacked.byteLength);
  const loader=new GLTFLoader();
  loader.parse(buf,'',g=>{
    model=g.scene;scene.add(model);
    const remove=[];
    model.traverse(o=>{
      if(String(o.name||'').toLowerCase().includes('plane')){remove.push(o);return;}
      if(o.isBone)bones[o.name]=o;
      if(o.isMesh&&o.material){for(const m of (Array.isArray(o.material)?o.material:[o.material])){if(String(m.name||'').toLowerCase().includes('hair')){m.map=null;m.color?.set(0xffffff);m.roughness=.72;m.needsUpdate=true;}}}
    });
    remove.forEach(o=>o.parent?.remove(o));
    const clip=g.animations[0];if(!clip)throw new Error('Ingen animation');
    mixer=new THREE.AnimationMixer(model);action=mixer.clipAction(clip);action.play();mixer.update(0);sampleNaturalPose(.25);
    resize();fitCamera();setState('idle');loading.style.display='none';
  },err=>{throw err;});
 }catch(e){console.error(e);loading.textContent='Kunde inte ladda Zeus';status.textContent='Fel';}
}
loadModel();

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000;
 if(model){
   model.rotation.set(0,userYaw,0);
   if(state==='idle'){mixer?.update(dt);}
   else if(state==='listening'){
     restoreBase();
     const sway=Math.sin(t*2.0);
     rot('Spine_01',-.09+.015*sway,0,0);rot('Chest_02',-.14+.02*sway,0,0);rot('Head_03',-.10+.025*Math.sin(t*2.6),-.10,.12);
     rot('Shoulder.R_017',-.12,.05,-.42);rot('Elbow.R_018',0,.05,-.72);rot('Wrist.R_019',0,.12,-.12);
     model.rotation.x=-.035;model.rotation.z=.012*Math.sin(t*1.6);
   } else if(state==='thinking'){
     restoreBase();
     rot('Chest_02',-.04,.08,0);rot('Head_03',-.22+.018*Math.sin(t*1.1),.16,.10);
     rot('Shoulder.R_017',-.32,.12,-.72);rot('Elbow.R_018',-.10,.10,-1.08);rot('Wrist.R_019',0,.22,-.18);
     rot('Shoulder.L_05',0,0,.08);model.rotation.x=0;model.rotation.z=.012*Math.sin(t*.8);
   } else if(state==='speaking'){
     restoreBase();
     const a=Math.sin(t*4.8),b=Math.sin(t*3.1+1.2);
     rot('Spine_01',.025*b,.05*b,0);rot('Chest_02',.04*b,.06*a,0);rot('Head_03',.045*a,.10*b,.025*a);
     rot('Shoulder.L_05',-.10,0,.30+.20*b);rot('Elbow.L_06',0,0,.42+.22*a);
     rot('Shoulder.R_017',-.10,0,-.30-.20*b);rot('Elbow.R_018',0,0,-.42-.22*a);
     model.rotation.x=.018*b;model.rotation.z=.018*a;
   }
 }
 renderer.render(scene,camera);
}
animate();

viewer.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;viewer.setPointerCapture(e.pointerId)});
viewer.addEventListener('pointermove',e=>{if(!drag)return;userYaw+=(e.clientX-lastX)*.008;lastX=e.clientX});
viewer.addEventListener('pointerup',()=>drag=false);viewer.addEventListener('pointercancel',()=>drag=false);
window.ZeusAvatar={setState,reset:()=>{userYaw=0;fitCamera();setState(state)}};
</script>
</body>
</html>
