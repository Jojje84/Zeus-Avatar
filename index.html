<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>Zeus Companion</title>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
<style>
:root{--text:#f4f8ff;--muted:#9db2cb;--blue:#81d3ff;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 28%,#173d69 0,#081421 44%,#03070c 100%);color:var(--text)}
.app{position:fixed;inset:0;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:5;background:linear-gradient(180deg,rgba(3,8,14,.78),transparent)}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#a5e4ff,#609bff);color:#07111e;font-size:23px;font-weight:900}.title{font-weight:850;font-size:1rem}.sub{font-size:.72rem;color:var(--muted);margin-top:1px}.status{font-size:.76rem;color:#cfeaff;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#07111eb8}
.viewer{position:absolute;inset:0;overflow:hidden;background:transparent}.viewer iframe{position:absolute;inset:-6%;width:112%;height:112%;border:0;background:transparent;display:block}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;padding:9px 13px;border-radius:999px;background:#07111ee8;border:1px solid var(--line);font-size:.78rem}.controls{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;display:flex;gap:7px;padding:7px;border:1px solid var(--line);border-radius:18px;background:#06101de8;backdrop-filter:blur(14px);max-width:calc(100vw - 16px)}button{border:1px solid var(--line);border-radius:12px;background:#ffffff0a;color:var(--text);padding:9px 11px;cursor:pointer;white-space:nowrap;font-size:.76rem}button.active{background:#5e9cff28;border-color:#81d3ff99}.credit{position:absolute;right:9px;bottom:7px;z-index:5;font-size:.58rem;color:#71869d;opacity:.72}.credit a{color:#87bde0;text-decoration:none}
.state-glow{position:absolute;inset:0;pointer-events:none;z-index:2;transition:.25s}.app[data-state="listening"] .state-glow{box-shadow:inset 0 0 80px rgba(75,175,255,.12)}.app[data-state="thinking"] .state-glow{box-shadow:inset 0 0 85px rgba(239,197,107,.11)}.app[data-state="speaking"] .state-glow{animation:pulse .55s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:inset 0 0 110px rgba(88,170,255,.20)}}
@media(max-width:600px){.top{height:56px;padding:8px}.logo{width:36px;height:36px}.sub{display:none}.status{font-size:.68rem;padding:6px 8px}.viewer iframe{inset:-10%;width:120%;height:120%}.controls{gap:5px;padding:5px}.controls button{padding:8px 9px;font-size:.7rem}.credit{display:none}}
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="top"><div class="brand"><div class="logo">ϟ</div><div><div class="title">Zeus Companion</div><div class="sub">Bara Zeus — tätt beskuren och centrerad</div></div></div><div class="status" id="status">Laddar</div></div>
  <div class="viewer"><div class="loading" id="loading">Laddar Zeus…</div><iframe id="api-frame" title="Zeus 3D" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe></div>
  <div class="state-glow"></div>
  <div class="controls">
    <button class="active" data-state="idle">😌 Idle</button>
    <button data-state="listening">👂 Lyssnar</button>
    <button data-state="thinking">🤔 Tänker</button>
    <button data-state="speaking">🗣️ Pratar</button>
  </div>
  <div class="credit">Zeus Idle — SomeDude · <a href="https://sketchfab.com/3d-models/zeus-idle-ed4308bda4604effb798d107c910ce37" target="_blank" rel="noopener">CC BY</a></div>
</div>
<script>
const UID='ed4308bda4604effb798d107c910ce37';
const iframe=document.getElementById('api-frame'),client=new Sketchfab('1.12.1',iframe),app=document.getElementById('app'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),buttons=[...document.querySelectorAll('[data-state]')].filter(x=>x.tagName==='BUTTON');
let api=null,animUID=null,duration=1.6,baseCamera=null,state='idle';
const statusText={idle:'Idle',listening:'Lyssnar',thinking:'Tänker',speaking:'Pratar'};
function setHairWhite(){api.getMaterialList((err,mats)=>{if(err||!mats)return;const hair=mats.find(m=>String(m.name||'').toLowerCase().includes('hair'));if(!hair)return;const m=JSON.parse(JSON.stringify(hair));for(const k of ['AlbedoPBR','DiffusePBR','DiffuseColor'])if(m.channels&&m.channels[k]){m.channels[k].enable=true;m.channels[k].color=[1,1,1];m.channels[k].texture=null}api.setMaterial(m)})}
function hidePlane(done){api.getNodeMap((err,nodes)=>{if(err||!nodes){done();return}const planes=Object.values(nodes).filter(n=>{const s=String(n.name||'').toLowerCase();return s==='plane'||s.includes('plane_material')});if(!planes.length){done();return}let left=planes.length;planes.forEach(n=>api.hide(n.instanceID,()=>{if(--left===0)done()}))})}
function tightFrame(){api.recenterCamera(()=>api.getCameraLookAt((err,c)=>{if(err||!c)return;const p=c.position,t=c.target,dx=p[0]-t[0],dy=p[1]-t[1],dz=p[2]-t[2];const zoom=.34;const target=[t[0],t[1]+Math.hypot(dx,dy,dz)*.015,t[2]];const pos=[target[0]+dx*zoom,target[1]+dy*zoom,target[2]+dz*zoom];baseCamera={position:pos,target};api.setCameraLookAt(pos,target,0)}))}
function playIdle(){if(!api||!animUID)return;api.setCurrentAnimationByUID(animUID,()=>{api.setCycleMode('loopOne');api.setSpeed(1);api.seekTo(0,()=>api.play())})}
function applyState(s){state=s;app.dataset.state=s;statusEl.textContent=statusText[s];buttons.forEach(b=>b.classList.toggle('active',b.dataset.state===s));if(!api||!animUID)return;if(s==='idle'){api.setCycleMode('loopOne');api.setSpeed(1);api.play()}else if(s==='listening'){api.setCycleMode('loopOne');api.setSpeed(.65);api.play()}else if(s==='thinking'){api.pause();api.seekTo(Math.min(duration*.56,duration-.08),()=>api.pause())}else{api.setCycleMode('loopOne');api.setSpeed(1.35);api.seekTo(0,()=>api.play())}}
buttons.forEach(b=>b.addEventListener('click',()=>applyState(b.dataset.state)));
client.init(UID,{autostart:1,preload:1,camera:0,dnt:1,transparent:1,ui_controls:0,ui_infos:0,ui_help:0,ui_settings:0,ui_inspector:0,ui_vr:0,ui_ar:0,ui_watermark:0,animation_autoplay:0,success:_api=>{api=_api;api.start();api.addEventListener('viewerready',()=>{api.setEnableCameraConstraints(false);setHairWhite();api.getAnimations((err,a)=>{if(!err&&a&&a.length){animUID=a[0][0];duration=Number(a[0][2]||1.6)}hidePlane(()=>{setTimeout(()=>{tightFrame();if(animUID)playIdle();loading.style.display='none';statusEl.textContent='Idle'},220)})})})},error:()=>{loading.textContent='Kunde inte ladda Zeus';statusEl.textContent='Fel'}});
window.ZeusAvatar={setState:applyState,tightFrame,play:playIdle};
</script>
</body></html>
